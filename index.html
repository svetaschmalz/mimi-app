10px}dialog{border:0;border-radius:18px;width:min(540px,94vw);padding:27px;max-height:90vh;color:var(--ink)}dialog::backdrop{background:#29212166}label{display:block;font-size:12px;margin:17px 0 7px;color:#776660}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:25px}.calc-result{background:#f1dfdb;border:0;position:sticky;top:20px;height:fit-content}.calc-result .value{font-size:40px}.help{font-size:12px;color:var(--muted);line-height:1.7;margin-top:12px}#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 22px;border-radius:10px;display:none;z-index:10}.check{accent-color:var(--green);width:19px;height:19px}.mode{display:flex;gap:8px;margin-bottom:22px}.mode button{flex:1;padding:13px;border:1px solid var(--line);border-radius:9px}.mode .active{background:#f1dfdb;border-color:#c9a29a}a{color:var(--green)}@media(max-width:1000px){aside{width:205px;padding:30px 15px}main{margin-left:205px;padding:0 25px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero-art{font-size:65px;padding:0 10px}}@media(max-width:650px){aside{z-index:5;inset:auto 0 0;width:100%;padding:0;background:#fffdf9;border-top:1px solid var(--line)}.brand,.aside-foot{display:none}nav{display:flex;justify-content:space-around;margin:0;gap:0;padding:7px 3px max(7px,env(safe-area-inset-bottom))}nav button{font-size:9px;padding:5px 4px;text-align:center;border-radius:8px;flex:1}nav b{display:block;width:auto;font-size:20px;margin-bottom:4px}main{margin:0;padding:0 19px 85px}header{height:65px;font-size:10px}.heading{margin:27px 0 21px;align-items:flex-start}h1{font-size:27px}.subtitle{font-size:12px}.heading .btn{padding:11px 13px;font-size:12px;white-space:nowrap}.hero{padding:24px}.hero h2{font-size:21px}.hero p{font-size:12px;line-height:1.7}.hero-art{display:none}.card{padding:19px}.stats{gap:10px;margin:16px 0}.value{font-size:24px}.stat-label{font-size:11px}.grid{gap:16px}.quick{gap:8px}.quick button{font-size:11px;padding:13px 9px}.form-grid{gap:0 12px}.calc-result{position:static}.record-top{flex-wrap:wrap}#toast{bottom:90px;width:max-content;max-width:90vw}}

html, body {
  max-width: 100%; overflow-x: hidden;
  margin: 0; padding: 0; box-sizing: border-box;
}
@media (max-width: 650px) {
  main, aside, nav, .card, input, textarea, select, button { max-width: 100%; min-width: 0; }
  main { width: 100%; overflow-wrap: anywhere; }
  .stats, .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .quick { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid, .records { grid-template-columns: minmax(0, 1fr); }
  .grid > *, .stats > *, .form-grid > *, .row > *, .heading > *, .record-top > * { min-width: 0; }
  .heading, .row, .actions, .section-head, .form-actions { flex-wrap: wrap; }
  .heading .btn { white-space: normal; }
  dialog { width: 94%; max-width: 100%; overflow-wrap: anywhere; }
  nav button { flex: 1 1 0; }
  table { width: 100%; table-layout: fixed; }
  img, svg { max-width: 100%; }
  input, textarea, select { font-size: 16px; }
}
@media (max-width: 360px) {
  .form-grid { grid-template-columns: minmax(0, 1fr); }
}
.row-counter{margin-top:16px}.row-counter p{margin-bottom:6px}.row-controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.row-controls output{font-size:32px;font-weight:650;font-variant-numeric:tabular-nums}.row-controls button,.row-reset{min-height:44px}.row-controls button:disabled{opacity:.45}.row-reset{margin-top:4px;color:var(--muted)}.business-cover{display:block;width:100%;max-width:100%;height:auto;border-radius:16px}.business-cover + .hero{margin-top:16px}.author-credit{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.5}.y-photo{width:76px;height:76px;object-fit:cover;border-radius:12px}.y-usage{margin:20px 0;padding:12px;border:1px solid var(--line);border-radius:10px;min-width:0}#y-error{color:#9c302c}#y-error:empty{display:none}@media(max-width:650px){nav button{line-height:1.15;overflow-wrap:anywhere}}
#calcform h3{margin:22px 0 8px}#stock-cost{min-width:0;border:0;margin:0;padding:0}.signal{border-radius:10px;padding:12px}.signal.low{background:#ffe1dd;color:#8a231c}.signal.caution{background:#fff0cc;color:#755415}.signal.ok{background:#e5eddf;color:#355239}.estimate-actions{display:grid;gap:10px;margin:18px 0}#estimate-preview{display:block;width:100%;height:auto;margin:20px 0}</style></head><body><aside><div class="brand">✳ <span>Мой маленький<br>бизнес<small>ПРОСТРАНСТВО МАСТЕРА</small></span></div><nav id="nav"></nav><div class="aside-foot">Сделано с заботой<br>о вашем деле ♡</div></aside><main><header><span>Маленькие шаги. Своё большое дело.</span><button class="avatar" onclick="go('settings')">МБ</button></header><div id="app"></div><footer>Данные сохраняются в этом браузере. Резервная копия — в разделе «Ещё».<div class="author-credit">создано Bo Gatti автор Светлана Шмальц</div></footer></main><dialog id="modal"><form id="form"></form></dialog><div id="toast" role="status"></div><script>
const telegram = window.Telegram?.WebApp;
if (telegram) {
  window.Telegram.WebApp.expand();
  window.Telegram.WebApp.ready();

}
const telegramId = telegram?.initDataUnsafe?.user?.id;
const storageKey = telegramId ? 'little-business-v1-tg-' + telegramId : 'little-business-v1';
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n)+' ₽', esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
let db;try{db=JSON.parse(localStorage.getItem(storageKey))}catch{}db=db||{orders:[],expenses:[],ideas:[],notes:[],tasks:[],templates:[]};
let page='home',filter='Все',period='month',mode='physical',calcDraft={};
const titles={home:['⌂','Обзор'],orders:['▤','Заказы'],expenses:['↗','Расходы'],calc:['⊞','Цена'],ideas:['✧','Контент'],notes:['▧','Заметки'],yarn:['◉','Склад пряжи'],settings:['☰','Ещё']};
const statuses={orders:['Новый','В работе','Готов','Передан','Отменён'],expenses:['Оплачен','Запланирован'],ideas:['Идея','В работе','Опубликовано'],notes:['Активная','В архиве'],tasks:['Предстоит','Готово']};
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(db));return true}catch{alert('Не удалось сохранить данные. Сделайте резервную копию в разделе «Ещё».');return false}}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2500)}
function go(p){page=p;filter='Все';render();window.scrollTo(0,0)}
function heading(t,s,button=''){return `<div class="heading"><div><h1>${t}</h1><div class="subtitle">${s}</div></div>${button}</div>`}
function addBtn(type,label){return `<button class="btn" onclick="edit('${type}')">＋ ${label}</button>`}
function empty(title,sub){return `<div class="empty"><strong>${title}</strong>${sub}</div>`}
function inPeriod(date){return period==='all'||(date&&date.startsWith(today().slice(0,7)))}
function activeOrders(){return db.orders.filter(o=>!['Передан','Отменён'].includes(o.status))}
function orderRow(o){return `<div class="row"><div><h3>${esc(o.title)}</h3><p>${esc(o.client||'Без клиента')} · ${o.date?esc(o.date.split('-').reverse().join('.')):'Без срока'}</p><span class="badge">${esc(o.status)}</span></div><b>${money(o.price)}</b></div>`}
function render(){ $('#nav').innerHTML=Object.entries(titles).map(([k,[i,t]])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><b>${i}</b>${t}</button>`).join('');
if(page==='home')home();else if(page==='calc')calculator();else if(page==='yarn')warehouse();else if(page==='settings')settings();else list(page); }
let counterTarget = '';
function currentWork() {
  return db.orders.find(order => order.id === counterTarget) || db;
}
function rowCount() {
  const count = currentWork().rows;
  return Number.isSafeInteger(count) && count >= 0 ? count : 0;
}
function openRows(id) {
  if (id !== undefined) counterTarget = id;
  const work = currentWork();
  if (work === db) counterTarget = '';
  const form = $('#form');
  form.onsubmit = event => event.preventDefault();
  form.innerHTML = `<h2>Счётчик рядов</h2><label for="counter-work">Для какого изделия?</label>
    <select id="counter-work" onchange="openRows(this.value)"><option value="">Без заказа</option>
    ${db.orders.map(o => `<option value="${esc(o.id)}" ${o.id === counterTarget ? 'selected' : ''}>${esc(o.title)}${o.client ? ' · '+esc(o.client) : ''}</option>`).join('')}</select>
    <label for="counter-part">Деталь изделия</label>
    <input id="counter-part" maxlength="100" placeholder="Например, левый рукав" value="${esc(work.part || '')}">
    <p>Связано рядов</p><div class="row-controls">
    <button type="button" class="btn light" id="row-minus" onclick="changeRows(-1)" aria-label="Убрать ряд">−</button>
    <output id="row-count" aria-live="polite"></output><button type="button" class="btn" onclick="changeRows(1)">+1 ряд</button></div>
    <button type="button" class="row-reset" onclick="resetRows()">Начать с нуля</button>
    <div class="form-actions"><button type="button" class="btn light" onclick="$('#modal').close()">Закрыть</button></div>`;
  $('#counter-part').oninput = event => { work.part = event.target.value; persist(); };
  displayRows();
  if (!$('#modal').open) $('#modal').showModal();
}
function displayRows() {
  $('#row-count').textContent = rowCount();
  $('#row-minus').disabled = rowCount() === 0;
}
function changeRows(step) {
  const work = currentWork(), old = rowCount();
  work.rows = Math.max(0, old + step);
  if (!Number.isSafeInteger(work.rows) || !persist()) work.rows = old;
  displayRows();
}
function resetRows() {
  if (rowCount() && confirm('Начать счёт рядов с нуля для этого изделия?')) changeRows(-rowCount());
}
function openGauge() {
  const form = $('#form');
  const dimensions = [
    ['stitches','Петли','в ширину','Количество петель по описанию'],
    ['rows','Ряды','в высоту','Количество рядов по описанию']
  ];
  form.innerHTML = '<h2>Расчёт под свою плотность</h2><p class="subtitle">Посчитайте петли и ряды в 10 см высохшего после стирки образца. Калькулятор разделит вашу плотность на плотность из МК и умножит число из описания на полученный коэффициент. Ниже уже есть пример — замените цифры своими.</p>' +
    dimensions.map(([key,title,direction,label]) => `<section><h3>${title}</h3>
    ${field(key+'-pattern','В МК на 10 см '+direction,key==='rows'?'32':'22','text','inputmode="decimal"')}
    ${field(key+'-own','У меня на 10 см '+direction,key==='rows'?'28':'27,5','text','inputmode="decimal"')}
    ${field(key+'-count',label,key==='rows'?'48':'88','text','inputmode="numeric"')}
    <p style="white-space:pre-line;line-height:1.65;background:#f5e7e3;border-radius:10px;padding:12px" role="status" id="${key}-result"></p></section>`).join('') +
    '<p class="help">Результат округлён до целого. Для узора проверьте кратность раппорта и кромочные. Прибавки и убавки рассчитываются отдельно.</p><div class="form-actions"><button type="button" class="btn" onclick="this.closest(&quot;dialog&quot;).close()">Готово</button></div>';
  form.onsubmit = event => event.preventDefault();
  function update() {
    for (const [key] of dimensions) {
      const values = ['pattern','own','count'].map(part => $('#f-'+key+'-'+part).value.trim());
      $('#'+key+'-result').textContent = gaugeResult(values,key);
    }
  }
  form.querySelectorAll('input').forEach(input => input.addEventListener('input', update));
  update();
  $('#modal').showModal();
}
function gaugeResult(values,key) {
  const [patternText, ownText, countText] = values;
  if (!patternText || !ownText) return 'Введите обе плотности на 10 см.';
  const positive = text => /^\d+(?:[,.]\d+)?$/.test(text) ? Number(text.replace(',','.')) : NaN;
  const pattern = positive(patternText), own = positive(ownText);
  if (![pattern,own].every(n => Number.isFinite(n) && n > 0)) return 'Укажите плотность больше нуля.';
  const fmt = n => n.toLocaleString('ru-RU',{maximumSignificantDigits:6});
  const factor = own / pattern;
  if (!Number.isFinite(factor) || factor <= 0) return 'Проверьте введённую плотность.';
  const sign = Number(factor.toPrecision(6)) === factor ? '=' : '≈';
  const first = `Коэффициент: ${ownText} ÷ ${patternText} ${sign} ${fmt(factor)}`;
  if (!countText) return first + '\nВведите количество из описания.';
  const count = positive(countText);
  if (!Number.isSafeInteger(count) || count <= 0) return first + '\nКоличество по описанию должно быть положительным целым числом.';
  const raw = count * own / pattern, total = Math.round(raw);
  if (!Number.isSafeInteger(total) || total < 1) return first + '\nПроверьте количество: результат вне диапазона.';
  const action = key === 'rows' ? 'Связать для той же высоты' : 'Набрать для той же ширины';
  const unit = key === 'rows' ? 'р.' : 'п.';
  return first + `\n${action}: ${countText} × ${fmt(factor)} ${raw === total && sign === '=' ? '=' : '≈'} ${total.toLocaleString('ru-RU')} ${unit}`;
}

const fibers = ['Шерсть','Меринос','Мохер','Хлопок','Полухлопок','Акрил','Смесовка'];
const roundStock = n => Math.round(n * 1000000) / 1000000;
const qty = n => n.toLocaleString('ru-RU',{maximumFractionDigits:6});
const stock = () => db.yarn || [];

function commit(next) {
  try { localStorage.setItem(storageKey, JSON.stringify(next)); }
  catch { alert('Не удалось сохранить. Возможно, память заполнена. Попробуйте сохранить без фото.'); return false; }
  db = next;
  return true;
}

function yarnCards() {

  $('#y-cards').innerHTML = items.map(y=>`<article class="card"><div class="record-top"><div><h2>${esc(y.name)}</h2><p>${esc(y.color)}</p><span class="badge">${esc(y.fiber)}</span></div>${y.photo ? '<img class="y-photo" alt="Фото мотка" src="'+esc(y.photo)+'">' : ''}</div>

    <button class="btn light" aria-label="Прибавить один моток" onclick="adjustYarn('${y.id}',1)">＋</button></article>`).join('') || empty(stock().length?'Ничего не найдено':'Пока нет пряжи',stock().length?'Измените поиск или состав.':'Добавьте первый моток.');

function adjustYarn(id,step) {
  const y=stock().find(item=>item.id===id);
  if(!y || y.grams+step*y.weight<0)return;
  if(commit({...db,yarn:stock().map(item=>item.id===id?{...item,grams:roundStock(item.grams+step*item.weight)}:item)})) yarnCards();
}
async function smallPhoto(file) {
  if(!file)return '';
  const url=URL.createObjectURL(file);
  try {
    const image=new Image(); image.src=url; await image.decode();
    const scale=Math.min(1,400/Math.max(image.width,image.height));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(image.width*scale)); canvas.height=Math.max(1,Math.round(image.height*scale));
    const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/jpeg',0.76);
  } finally { URL.revokeObjectURL(url); }
}
function addYarn() {
  const form=$('#form');
  const num=(key,label,min)=>field(key,label,'','number','required min="'+min+'" max="1000000" step="0.01"');
  form.innerHTML='<h2>Добавить пряжу</h2>'+field('name','Название и бренд','','text','required maxlength="150" placeholder="Например, Drops Air"')+
    '<label for="fiber">Состав</label><select id="fiber" name="fiber">'+fibers.map(f=>'<option>'+f+'</option>').join('')+'</select>'+
    field('color','Цвет / номер партии','','text','maxlength="120"')+'<div class="form-grid"><div>'+num('weight','Вес мотка, г',0.01)+'</div><div>'+num('length','Метраж мотка, м',0.01)+'</div></div>'+
    num('count','Количество мотков',0)+field('tools','Спицы / крючок (необязательно)','','text','maxlength="100"')+
    '<label for="photo">Загрузить фото мотка из галереи (необязательно)</label><input id="photo" type="file" accept="image/*"><div class="form-actions"><button type="button" class="btn light" onclick="this.closest(\'dialog\').close()">Отмена</button><button class="btn">Сохранить</button></div>';
  const submit=form.querySelector('button:not([type])');
  form.onsubmit=async e=>{
    e.preventDefault(); if(submit.disabled)return;
    const d=Object.fromEntries(new FormData(form)); if(!d.name.trim())return;
    submit.disabled=true;
    try {
      const photo=await smallPhoto($('#photo').files[0]);
      if(!submit.isConnected || !$('#modal').open)return;
      const y={id:crypto.randomUUID(),name:d.name.trim(),fiber:d.fiber,color:d.color.trim(),tools:d.tools.trim(),weight:+d.weight,length:+d.length,grams:roundStock(+d.weight*+d.count),photo};
      if(commit({...db,yarn:[y,...stock()]})){ $('#modal').close();warehouse(); }
    } catch {alert('Фото не удалось открыть. Выберите другое изображение или сохраните без фото.');}
    finally {submit.disabled=false;}
  };
  $('#modal').showModal();
}

function readUsage() {
  const y=stock().find(item=>item.id===$('#y-choice').value);
  if(!y)return null;
  const amount=$('#y-amount').valueAsNumber, unit=$('#y-unit').value;
  return {id:y.id,amount,unit,grams:roundStock(amount*(unit==='grams'?1:y.weight))};
}
function shortage(previous,next) {
  if(!next || !Number.isFinite(next.grams))return '';
  const y=stock().find(item=>item.id===next.id);
  const deficit=roundStock(next.grams-y.grams-(previous?.id===next.id?previous.grams:0));
  return deficit>0?'Не хватает на складе! Нужно докупить: '+qty(deficit/y.weight)+' мотк. / '+qty(deficit)+' г.':'';
}
function refreshUsage(previous) {
  const active=!!$('#y-choice').value;
  $('#y-amount-group').hidden=!active;$('#y-amount').disabled=!active;$('#y-amount').required=active;
  const warning=shortage(previous,readUsage());
  $('#y-error').textContent=warning;$('#y-amount').setCustomValidity(warning);
}
// Apply only the difference between the previously saved allocation and its replacement.
function ledger(previous,next) {
  return stock().map(y=>{
    const delta=(previous?.id===y.id?previous.grams:0)-(next?.id===y.id?next.grams:0);
    return delta?{...y,grams:roundStock(y.grams+delta)}:y;
  });
}
function saveOrder(order,previous) {
  const next=readUsage();
  if(shortage(previous?.yarnUse,next) || (next && !(next.grams>0 && Number.isFinite(next.grams))))return false;
  order={...previous,...order,yarnUse:next};
  return commit({...db,yarn:ledger(previous?.yarnUse,next),orders:previous?db.orders.map(o=>o.id===order.id?order:o):[order,...db.orders]});
}

const rub = value => value.toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';
function priceModel(d, yarn) {
  const material = d.source==='stock' ? Number(d.unitPrice)*Number(d.quantity)/(d.unit==='grams'?yarn.weight:1) : Number(d.materials);
  const supplies = material + Number(d.pack);
  const costs = supplies * (1+Number(d.wear)/100);
  const labor = Number(d.hours)*Number(d.rate)*(d.rush?1.2:1);
  const deductions = (Number(d.fee)+Number(d.tax))/100;
  const target = costs+labor+Number(d.profit||0);
  const recommended = Math.ceil(target/(1-deductions)*100-1e-8)/100;
  const price = d.custom==='' ? recommended : Number(d.custom);
  const earned = price*(1-deductions)-costs;
  return {material,costs,labor,recommended,price,earned,hourly:earned/Number(d.hours),totalCost:Math.round((costs+labor+price*deductions)*100)/100};
}

function drawEstimate(canvas,details) {
  canvas.width=900;
  const ctx=canvas.getContext('2d');
  const lines=[]; let y=50;
  function paragraph(text,size,weight,gap,color='#392e2a') {
    ctx.font=weight+' '+size+'px sans-serif';
    let line='';
    function push(){lines.push({line,y,font:ctx.font,color});y+=size*1.35;line='';}
    for(const word of String(text).split(/\s+/)){
      if(line && ctx.measureText(line+' '+word).width>750)push();
      if(line)line+=' ';
      for(const char of word){if(ctx.measureText(line+char).width>750)push();line+=char;}
    }
    if(line)push();
    y+=gap;
  }
  paragraph(details.workshop,32,'600',4);
  paragraph(new Date().toLocaleDateString('ru-RU'),22,'400',42);
  paragraph('Смета на индивидуальный заказ',42,'600',12);
  paragraph(details.title,34,'400',30);
  for(const [label,value] of [['Пряжа / состав',details.yarn],['Цвет',details.color],['Срок готовности',details.date]])
    if(value)paragraph(label+' · '+value,25,'400',8);
  y+=20;
  paragraph('Итоговая стоимость',25,'400',10);
  paragraph(rub(details.price),58,'600',15);
  const cents=Math.round(details.price*100), advance=Math.round(cents/2);
  paragraph('Предоплата 50% для начала работы · '+rub(advance/100),25,'400',6);
  paragraph('Остаток при готовности · '+rub((cents-advance)/100),25,'400',40);
  paragraph(details.contact,24,'400',16);
  paragraph('Оформлено в приложении Мой маленький бизнес',19,'400',0,'#79645c');
  canvas.height=Math.ceil(y+35);ctx.fillStyle='#fcf6ed';ctx.fillRect(0,0,900,canvas.height);
  ctx.strokeStyle='#d9bfb1';ctx.lineWidth=2;ctx.strokeRect(25,25,850,canvas.height-50);
  ctx.textBaseline="top";
  for(const item of lines){ctx.font=item.font;ctx.fillStyle=item.color;ctx.fillText(item.line,72,item.y);}
}

  share.onclick=async()=>{if(!file)return;try{
    if(!navigator.canShare?.({files:[file]})){status.textContent='На этом устройстве сохраните картинку и прикрепите её к сообщению.';return;}

k="templates('calc')">Мои шаблоны</button></div></section><section class="card calc-result" id="result" aria-live="polite"></section></div>`;$('#calcform').oninput=calc;calc();}
function switchMode(m){calcDraft={};mode=m;calculator()}
function calc(){let f=$('#calcform');if(mode==='physical'){physicalResult(f);return;}if(!f.checkValidity()){$('#result').innerHTML='<h2>Проверьте поля</h2><p>Введите неотрицательные числа. Комиссия должна быть меньше 100%, продажи — целым числом от 1.</p>';return}let d=Object.fromEntries(new FormData(f));calcDraft=d;let labor=+d.hours*+d.rate,creation=+d.materials+labor,base=(mode==='digital'?creation/+d.sales:creation)+ +d.pack,price=(base+ +d.profit)/(1- +d.fee/100);price=Math.ceil(price);let commission=price*+d.fee/100,profit=price-base-commission;$('#result').innerHTML=`<div class="eyebrow">РЕКОМЕНДУЕМАЯ ЦЕНА ${mode==='digital'?'ЗА ОДНУ ПРОДАЖУ':''}</div><div class="value">${money(price)}</div><p class="subtitle">Ваш труд имеет ценность ♡</p>${[['Оплата вашего времени',money(labor)],...(mode==='digital'?[['Затраты на создание',money(creation)]]:[]),['Себестоимость '+(mode==='digital'?'одной продажи':''),money(base)],['Комиссия',money(commission)],['Прибыль сверх оплаты труда',money(profit)]].map(([l,v])=>`<div class="row"><span>${l}</span><b>${v}</b></div>`).join('')}<p class="help">Цена округлена вверх до рубля.${mode==='digital'?' Затраты на создание распределены на '+esc(d.sales)+' продаж.':''}</p><button type="button" class="btn" id="calc-order">Создать заказ</button><button class="btn light" id="digital-estimate">📄 Сформировать смету для клиента</button>`;$('#digital-estimate').onclick=()=>openEstimate({title:d.name,price});$('#calc-order').onclick=()=>edit('orders',null,{title:d.name,price,cost:Number((base+commission).toFixed(2))});}
function saveCalc(){if(!$('#calcform').reportValidity())return;db.templates.push({id:crypto.randomUUID(),type:'calc',name:calcDraft.name||'Расчёт '+(mode==='digital'?'цифрового продукта':'изделия'),data:{...calcDraft,mode}});persist();toast('Расчёт сохранён в шаблоны')}
function settings(){$('#app').innerHTML=heading('Всё под рукой','Ваши данные и полезные привычки.')+`<div class="grid"><section class="card"><h2>Резервная копия</h2><p class="subtitle">Записи автоматически сохраняются на этом устройстве, в этом браузере. Для переноса на другой телефон сохраните копию и загрузите её там.</p><button class="btn" onclick="backup()">Скачать копию</button><label for="restore">Восстановить из копии</label><input type="file" id="restore" accept=".json,application/json" onchange="restore(this.files[0])"><p class="help">При восстановлении текущие записи заменятся данными из копии.</p></section><section class="card"><h2>Как читать сводку</h2><p class="subtitle">«Получено» — суммы оплат из заказов по указанной дате оплаты. Отменённые заказы не учитываются.</p><p class="subtitle">«Расходы» — оплаченные записи раздела «Расходы». Запланированные расходы не списываются.</p><p class="subtitle">«Остаток» показывает движение денег. Прибыль отдельного заказа — его цена минус указанные затраты. Калькулятор помогает спланировать цену, но не создаёт расход автоматически.</p><button class="btn light" onclick="showTasks()">Открыть все задачи</button></section></div>`}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,data:db},null,2)],{type:'application/json'}));a.download='moy-biznes-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restore(file){if(!file)return;try{let v=JSON.parse(await file.text());if(v.version!==1||!v.data)throw 0;for(let k of ['orders','expenses','ideas','notes','tasks','templates']){if(!Array.isArray(v.data[k]))throw 0;for(let x of v.data[k])if(!x||typeof x.id!=='string'||(k!=='templates'&&typeof x.title!=='string'))throw 0}for(let o of v.data.orders)if(![o.price,o.paid,o.cost].every(n=>Number.isFinite(n)&&n>=0))throw 0;for(let e of v.data.expenses)if(!Number.isFinite(e.amount)||e.amount<0)throw 0;if(v.data.yarn!==undefined){if(!Array.isArray(v.data.yarn)||!v.data.yarn.every(y=>y&&/^[a-zA-Z0-9_-]+$/.test(y.id)&&typeof y.name==='string'&&fibers.includes(y.fiber)&&[y.weight,y.length,y.grams].every(Number.isFinite)&&y.weight>0&&y.length>0&&y.grams>=0))throw 0;}for(const o of v.data.orders){const u=o.yarnUse;if(u&&(!v.data.yarn?.some(y=>y.id===u.id)||!Number.isFinite(u.amount)||!Number.isFinite(u.grams)||u.grams<=0||u.amount<=0||!['grams','skeins'].includes(u.unit)))throw 0;}if(!confirm('Заменить все текущие записи данными из копии?'))return;if(!commit(v.data))return;settings();toast('Данные восстановлены')}catch{alert('Не удалось прочитать копию. Выберите JSON-файл, скачанный из этого приложения.')}}
render();

</script></body></html>
