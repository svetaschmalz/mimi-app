<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><meta name="theme-color" content="#faf7f2"><title>Мой маленький бизнес</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{color-scheme:light}:root{--ink:#242120;--muted:#817773;--green:#252222;--line:#e9dfda}*{box-sizing:border-box}body{margin:0;background:#faf7f2;color:var(--ink);font:14px 'Avenir Next',system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;background:transparent;color:inherit}aside{width:248px;position:fixed;inset:0 auto 0 0;background:#fffdf9;border-right:1px solid var(--line);padding:38px 22px}.brand{display:flex;gap:12px;font-size:35px;color:var(--green);align-items:center}.brand span{font-size:19px;font-weight:700;line-height:1.3}.brand small{display:block;font-size:8px;letter-spacing:1.7px;margin-top:10px;color:var(--muted)}nav{display:grid;gap:8px;margin-top:55px}nav button{text-align:left;padding:14px 17px;border-radius:10px;color:#827773}nav button.active{background:#f0e0dc;color:var(--green);font-weight:700}nav b{display:inline-block;width:30px;font-size:19px}.aside-foot{position:absolute;bottom:35px;color:#948580;font-size:12px;line-height:1.8}main{margin-left:248px;padding:0 46px;max-width:1600px}header{height:91px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.avatar{background:#efdfd9;border-radius:50%;width:37px;height:37px;font-weight:700}h1{font-size:32px;letter-spacing:-1.2px;margin:0 0 9px}h2{font-size:19px;margin:0}h3{margin:0;font-size:15px}.subtitle{color:var(--muted);line-height:1.7}.heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:35px 0 27px}.btn{background:var(--green);color:white;border-radius:9px;padding:13px 19px;font-weight:600}.btn.light{background:white;color:var(--green);border:1px solid var(--line)}.hero{background:#f1dfdb;border-radius:17px;padding:30px 33px;display:flex;justify-content:space-between;align-items:center}.hero h2{font-size:26px;line-height:1.4;font-weight:500;max-width:440px}.hero p{color:#85706a;margin-bottom:0}.hero-art{font-size:88px;color:#b98f87;transform:rotate(-15deg);padding:0 30px}.eyebrow{font-size:10px;letter-spacing:1.7px;color:#866b64;font-weight:700;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:23px}.stat-label{color:var(--muted);font-size:12px}.value{font-size:27px;font-weight:650;margin:12px 0 7px;letter-spacing:-1px}.tiny{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:23px;margin-bottom:24px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.link{color:var(--green);font-size:12px}.row{padding:17px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;align-items:center}.row p{margin:6px 0;color:var(--muted);font-size:12px}.badge{display:inline-block;background:#f5e7e3;color:#74584f;border-radius:6px;padding:5px 8px;font-size:10px}.empty{padding:28px 0;text-align:center;color:var(--muted);line-height:1.9}.empty strong{display:block;color:var(--ink);font-weight:500}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick button{background:#faf3ef;padding:20px 10px;border-radius:10px;text-align:left;line-height:2}.quick b{display:block;font-size:22px;color:#ac8177}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}select,input,textarea{width:100%;border:1px solid #e5d8d2;border-radius:8px;padding:12px;background:white;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:2px solid #bd948b}textarea{min-height:95px;resize:vertical}.toolbar select{width:auto}.records{display:grid;gap:14px}.actions{display:flex;gap:14px;margin-top:14px}.actions button{font-size:12px;color:var(--green);padding:7px 0}.actions .delete{color:#9d5149}.record p{white-space:pre-wrap;line-height:1.7}.record-top{display:flex;justify-content:space-between;gap:10px}.record strong{font-size:21px}footer{padding:30px 0;color:#968782;font-size:10px}dialog{border:0;border-radius:18px;width:min(540px,94vw);padding:27px;max-height:90vh;color:var(--ink)}dialog::backdrop{background:#29212166}label{display:block;font-size:12px;margin:17px 0 7px;color:#776660}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:25px}.calc-result{background:#f1dfdb;border:0;position:sticky;top:20px;height:fit-content}.calc-result .value{font-size:40px}.help{font-size:12px;color:var(--muted);line-height:1.7;margin-top:12px}#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 22px;border-radius:10px;display:none;z-index:10}.check{accent-color:var(--green);width:19px;height:19px}.mode{display:flex;gap:8px;margin-bottom:22px}.mode button{flex:1;padding:13px;border:1px solid var(--line);border-radius:9px}.mode .active{background:#f1dfdb;border-color:#c9a29a}a{color:var(--green)}@media(max-width:1000px){aside{width:205px;padding:30px 15px}main{margin-left:205px;padding:0 25px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero-art{font-size:65px;padding:0 10px}}@media(max-width:650px){aside{z-index:5;inset:auto 0 0;width:100%;padding:0;background:#fffdf9;border-top:1px solid var(--line)}.brand,.aside-foot{display:none}nav{display:flex;justify-content:space-around;margin:0;gap:0;padding:7px 3px max(7px,env(safe-area-inset-bottom))}nav button{font-size:9px;padding:5px 4px;text-align:center;border-radius:8px;flex:1}nav b{display:block;width:auto;font-size:20px;margin-bottom:4px}main{margin:0;padding:0 19px 85px}header{height:65px;font-size:10px}.heading{margin:27px 0 21px;align-items:flex-start}h1{font-size:27px}.subtitle{font-size:12px}.heading .btn{padding:11px 13px;font-size:12px;white-space:nowrap}.hero{padding:24px}.hero h2{font-size:21px}.hero p{font-size:12px;line-height:1.7}.hero-art{display:none}.card{padding:19px}.stats{gap:10px;margin:16px 0}.value{font-size:24px}.stat-label{font-size:11px}.grid{gap:16px}.quick{gap:8px}.quick button{font-size:11px;padding:13px 9px}.form-grid{gap:0 12px}.calc-result{position:static}.record-top{flex-wrap:wrap}#toast{bottom:90px;width:max-content;max-width:90vw}}

html, body {
  max-width: 100%; overflow-x: hidden;
  margin: 0; padding: 0; box-sizing: border-box;
}
@media (max-width: 650px) {
  main, aside, nav, .card, input, textarea, select, button { max-width: 100%; min-width: 0; }
  main { width: 100%; overflow-wrap: anywhere; }
  .stats, .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .quick { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid, .records { grid-template-columns: minmax(0, 1fr); }
  .grid > *, .stats > *, .form-grid > *, .row > *, .heading > *, .record-top > * { min-width: 0; }
  .heading, .row, .actions, .section-head, .form-actions { flex-wrap: wrap; }
  .heading .btn { white-space: normal; }
  dialog { width: 94%; max-width: 100%; overflow-wrap: anywhere; }
  nav button { flex: 1 1 0; }
  table { width: 100%; table-layout: fixed; }
  img, svg { max-width: 100%; }
  input, textarea, select { font-size: 16px; }
}
@media (max-width: 360px) {
  .form-grid { grid-template-columns: minmax(0, 1fr); }
}
</style></head><body><aside><div class="brand">✳ <span>Мой маленький<br>бизнес<small>ПРОСТРАНСТВО МАСТЕРА</small></span></div><nav id="nav"></nav><div class="aside-foot">Сделано с заботой<br>о вашем деле ♡</div></aside><main><header><span>Маленькие шаги. Своё большое дело.</span><button class="avatar" onclick="go('settings')">МБ</button></header><div id="app"></div><footer>Данные сохраняются в этом браузере. Резервная копия — в разделе «Ещё».</footer></main><dialog id="modal"><form id="form"></form></dialog><div id="toast" role="status"></div><script>
const telegram = window.Telegram?.WebApp;
if (telegram) {
  window.Telegram.WebApp.expand();
  window.Telegram.WebApp.ready();

}
const telegramId = telegram?.initDataUnsafe?.user?.id;
const storageKey = telegramId ? 'little-business-v1-tg-' + telegramId : 'little-business-v1';
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n)+' ₽', esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
let db;try{db=JSON.parse(localStorage.getItem(storageKey))}catch{}db=db||{orders:[],expenses:[],ideas:[],notes:[],tasks:[],templates:[]};
let page='home',filter='Все',period='month',mode='physical',calcDraft={};
const titles={home:['⌂','Обзор'],orders:['▤','Заказы'],expenses:['↗','Расходы'],calc:['⊞','Цена'],ideas:['✧','Контент'],notes:['▧','Заметки'],settings:['☰','Ещё']};
const statuses={orders:['Новый','В работе','Готов','Передан','Отменён'],expenses:['Оплачен','Запланирован'],ideas:['Идея','В работе','Опубликовано'],notes:['Активная','В архиве'],tasks:['Предстоит','Готово']};
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(db));return true}catch{alert('Не удалось сохранить данные. Сделайте резервную копию в разделе «Ещё».');return false}}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2500)}
function go(p){page=p;filter='Все';render();window.scrollTo(0,0)}
function heading(t,s,button=''){return `<div class="heading"><div><h1>${t}</h1><div class="subtitle">${s}</div></div>${button}</div>`}
function addBtn(type,label){return `<button class="btn" onclick="edit('${type}')">＋ ${label}</button>`}
function empty(title,sub){return `<div class="empty"><strong>${title}</strong>${sub}</div>`}
function inPeriod(date){return period==='all'||(date&&date.startsWith(today().slice(0,7)))}
function activeOrders(){return db.orders.filter(o=>!['Передан','Отменён'].includes(o.status))}
function orderRow(o){return `<div class="row"><div><h3>${esc(o.title)}</h3><p>${esc(o.client||'Без клиента')} · ${o.date?esc(o.date.split('-').reverse().join('.')):'Без срока'}</p><span class="badge">${esc(o.status)}</span></div><b>${money(o.price)}</b></div>`}
function render(){ $('#nav').innerHTML=Object.entries(titles).map(([k,[i,t]])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><b>${i}</b>${t}</button>`).join('');
if(page==='home')home();else if(page==='calc')calculator();else if(page==='settings')settings();else list(page); }
function home(){let income=db.orders.filter(o=>o.status!=='Отменён'&&inPeriod(o.paidDate)).reduce((a,o)=>a+Number(o.paid||0),0),expense=db.expenses.filter(e=>e.status==='Оплачен'&&inPeriod(e.date)).reduce((a,e)=>a+Number(e.amount),0),active=activeOrders(),tasks=db.tasks.filter(t=>t.status!=='Готово').sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
$('#app').innerHTML=heading('Мой маленький бизнес','Всё важное для вашей мастерской в одном месте',addBtn('orders','Заказ'))+`<div class="hero"><div><div class="eyebrow">ВАШЕ ТВОРЧЕСТВО. ВАШ БИЗНЕС.</div><h2>Создавайте с удовольствием.<br>Остальное разложим по полочкам.</h2><p>Заказы, деньги и идеи — пусть для всего будет своё место.</p></div><div class="hero-art">✳</div></div><div class="section-head" style="margin:24px 0 -10px"><h3>Финансы</h3><select aria-label="Период сводки" style="width:auto" onchange="period=this.value;home()"><option value="month" ${period==='month'?'selected':''}>Этот месяц</option><option value="all" ${period==='all'?'selected':''}>Всё время</option></select></div><div class="stats">${[['Получено',money(income),'Фактические оплаты'],['Расходы',money(expense),'Только оплаченные'],['Остаток',money(income-expense),'Доходы минус расходы'],['Активные заказы',active.length,'В работе и ожидают вас']].map(([l,v,s])=>`<div class="card"><div class="stat-label">${l}</div><div class="value">${v}</div><div class="tiny">${s}</div></div>`).join('')}</div><div class="grid"><section class="card"><div class="section-head"><h2>Активные заказы</h2><button class="link" onclick="go('orders')">Все заказы ↗</button></div>${active.slice(0,4).map(orderRow).join('')||empty('Здесь появятся ваши заказы','Добавьте первый — и держите всё под рукой.')}<button class="link" onclick="edit('orders')">＋ Добавить заказ</button></section><section class="card"><div class="section-head"><h2>Ближайшие задачи</h2><button class="link" onclick="edit('tasks')">＋ Задача</button></div>${tasks.slice(0,5).map(t=>`<div class="row"><input class="check" type="checkbox" aria-label="Завершить ${esc(t.title)}" onchange="completeTask('${t.id}')"><div style="flex:1"><h3>${esc(t.title)}</h3><p>${t.date?esc(t.date.split('-').reverse().join('.')):'Без срока'} ${t.date&&t.date<today()?' · Просрочено':''}</p></div><button class="link" onclick="edit('tasks','${t.id}')">✎</button></div>`).join('')||empty('Можно немного выдохнуть','Новых задач пока нет.')}<button class="link" onclick="showTasks()">Все задачи (${db.tasks.length})</button></section></div><section class="card"><div class="section-head"><h2>С чего начнём?</h2><span class="tiny">Маленький шаг для вашего дела</span></div><div class="quick"><button onclick="go('calc')"><b>⊞</b>Рассчитать цену ↗</button><button onclick="edit('expenses')"><b>↗</b>Записать расход ↗</button><button onclick="edit('ideas')"><b>✧</b>Сохранить идею ↗</button></div></section>`;}
function completeTask(id){db.tasks.find(t=>t.id===id).status='Готово';persist();render();toast('Задача выполнена')}
function showTasks(){page='tasks';filter='Все';list('tasks')}
function list(type){let title={orders:'Заказы',expenses:'Расходы',ideas:'Идеи контента',notes:'Заметки',tasks:'Все задачи'}[type],sub={orders:'От первого сообщения до готового изделия.',expenses:'Чтобы знать, куда уходят деньги.',ideas:'Хорошая мысль больше не потеряется.',notes:'Ваши мысли, планы и маленькие открытия.',tasks:'Освободите голову — запишите следующий шаг.'}[type];let items=db[type].filter(x=>filter==='Все'||x.status===filter);
$('#app').innerHTML=heading(title,sub,addBtn(type,'Добавить'))+`<div class="toolbar"><select aria-label="Фильтр по статусу" onchange="filter=this.value;list('${type}')">${['Все',...statuses[type]].map(s=>`<option ${s===filter?'selected':''}>${s}</option>`).join('')}</select><button class="btn light" onclick="templates('${type}')">▧ Шаблоны</button></div><div class="records">${items.map(x=>`<article class="card record"><div class="record-top"><div><h2>${esc(x.title)}</h2><p class="tiny">${esc(x.client||x.category||x.channel||'')} ${x.date?' · '+esc(x.date.split('-').reverse().join('.')):''}</p></div><span class="badge">${esc(x.status)}</span></div>${type==='orders'?`<div class="row"><span>Стоимость <strong>${money(x.price)}</strong></span><span>Получено ${money(x.paid)}<br><small>Осталось ${money(Math.max(0,x.price-x.paid))}</small></span></div><p class="help">Ожидаемая прибыль: ${money(Number(x.price)-Number(x.cost||0))} · затраты по заказу: ${money(x.cost||0)}</p>`:type==='expenses'?`<div class="value">${money(x.amount)}</div>`:''}${x.text?`<p>${esc(x.text)}</p>`:''}<div class="actions"><button onclick="edit('${type}','${x.id}')">Изменить</button><button onclick="saveTemplate('${type}','${x.id}')">В шаблоны</button><button class="delete" onclick="remove('${type}','${x.id}')">Удалить</button></div></article>`).join('')||`<section class="card">${empty(filter==='Все'?'Пока здесь чистый лист':'Нет записей с таким статусом','Нажмите «Добавить», чтобы начать.')}</section>`}</div>`;}
function field(name,label,value='',type='text',extra=''){return `<label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}>`}
function edit(type,id,preset){let x=preset||db[type].find(x=>x.id===id)||{},numeric=(n,l,v=0)=>field(n,l,x[n]??v,'number','min="0" step="0.01" required');$('#form').innerHTML=`<h2>${id?'Изменить запись':'Новая запись'}</h2>${field('title',type==='orders'?'Что заказали?':'Название',x.title||'','text','required maxlength="150"')}${type==='orders'?field('client','Клиент / контакт',x.client||'')+`<div class="form-grid"><div>${numeric('price','Стоимость заказа, ₽')}</div><div>${numeric('paid','Получено, ₽')}</div><div>${numeric('cost','Все затраты на заказ, ₽')}</div><div>${field('paidDate','Дата полученной оплаты',x.paidDate||today(),'date')}</div></div><p class="help">«Получено» — общая сумма оплат по заказу. Укажите дату последней оплаты. Расходы для общей сводки записывайте отдельно в «Расходах».</p>`:''}${type==='expenses'?numeric('amount','Сумма, ₽')+field('category','Категория (например, пряжа)',x.category||''):''}${type==='ideas'?field('channel','Где опубликовать?',x.channel||'','text','placeholder="Например, Reels или Telegram"'):''}${field('date',type==='orders'?'Срок готовности':type==='expenses'?'Дата расхода':'Дата / срок (необязательно)',x.date|| (type==='expenses'?today():''),'date',type==='expenses'?'required':'')}<label for="f-status">Статус</label><select id="f-status" name="status">${statuses[type].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><label for="f-text">Подробности</label><textarea id="f-text" name="text" placeholder="Всё, что важно не забыть">${esc(x.text||'')}</textarea><div class="form-actions"><button type="button" class="btn light" onclick="$('#modal').close()">Отмена</button><button class="btn">Сохранить</button></div>`;
$('#form').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(!v.title.trim())return;['price','paid','cost','amount'].forEach(k=>{if(k in v)v[k]=Number(v[k])});if(type==='orders'&&v.paid>v.price){alert('Полученная оплата не может превышать стоимость заказа.');return}v.id=id||crypto.randomUUID();if(id)db[type]=db[type].map(a=>a.id===id?v:a);else db[type].unshift(v);persist();$('#modal').close();page==='home'?home():list(type);toast('Запись сохранена')};$('#modal').showModal();}
function remove(type,id){if(!confirm('Удалить запись? Это действие нельзя отменить.'))return;db[type]=db[type].filter(x=>x.id!==id);persist();list(type);toast('Запись удалена')}
function saveTemplate(type,id){let x=db[type].find(x=>x.id===id);db.templates.push({id:crypto.randomUUID(),type,name:x.title,data:{...x,id:undefined,date:'',paid:0,paidDate:''}});persist();toast('Шаблон сохранён')}
function templates(type){$('#form').innerHTML=`<h2>Шаблоны</h2>${db.templates.filter(t=>t.type===type).map(t=>`<div class="row"><button type="button" onclick="useTemplate('${t.id}')">${esc(t.name)} ↗</button><button type="button" class="link" onclick="deleteTemplate('${t.id}','${type}')">Удалить</button></div>`).join('')||empty('Шаблонов пока нет','Сохраните любую запись как шаблон.')}<div class="form-actions"><button type="button" class="btn light" onclick="$('#modal').close()">Закрыть</button></div>`;$('#form').onsubmit=e=>e.preventDefault();$('#modal').showModal()}
function useTemplate(id){let t=db.templates.find(t=>t.id===id);$('#modal').close();if(t.type==='calc'){mode=t.data.mode;calcDraft={...t.data};go('calc')}else edit(t.type,null,{...t.data})}
function deleteTemplate(id,type){if(confirm('Удалить шаблон?')){db.templates=db.templates.filter(t=>t.id!==id);persist();$('#modal').close();templates(type)}}
function calculator(){let digital=mode==='digital';$('#app').innerHTML=heading('Цена с уважением к себе','Учтите затраты, своё время и желаемую прибыль.')+`<div class="grid"><section class="card"><div class="mode"><button class="${!digital?'active':''}" onclick="switchMode('physical')">Изделие</button><button class="${digital?'active':''}" onclick="switchMode('digital')">МК / PDF / цифровой</button></div><form id="calcform">${field('name','Название расчёта',calcDraft.name||'','text','placeholder="Например, чепчик с ушками"')}<div class="form-grid">${(digital?[['materials','Доп. затраты на создание, ₽',0],['hours','Время создания, часов',0],['rate','Стоимость часа, ₽',500],['sales','Ожидаемые продажи, шт.',20],['pack','Расход на одну продажу, ₽',0],['profit','Желаемая прибыль с продажи, ₽',300],['fee','Комиссия с выручки, %',5]]:[['materials','Материалы, ₽',0],['hours','Время работы, часов',0],['rate','Стоимость часа, ₽',500],['pack','Упаковка, ₽',0],['profit','Желаемая прибыль, ₽',500],['fee','Комиссия с выручки, %',5]]).map(([n,l,v])=>`<div>${field(n,l,calcDraft[n]??v,'number',`min="${n==='sales'?1:0}" ${n==='fee'?'max="99.99"':''} step="${n==='sales'?1:'0.01'}" required`)}</div>`).join('')}</div></form><p class="help">${digital?'Стоимость создания делится на ожидаемое число продаж. Это план: если продаж меньше, затраты могут не окупиться.':'Стоимость вашего времени уже включена в затраты. Прибыль добавляется сверх оплаты труда.'} Комиссия считается от конечной цены. Налоги можно включить в общий процент.</p><div class="actions"><button onclick="saveCalc()">＋ Сохранить шаблон расчёта</button><button onclick="templates('calc')">Мои шаблоны</button></div></section><section class="card calc-result" id="result" aria-live="polite"></section></div>`;$('#calcform').oninput=calc;calc();}
function switchMode(m){calcDraft={};mode=m;calculator()}
function calc(){let f=$('#calcform');if(!f.checkValidity()){$('#result').innerHTML='<h2>Проверьте поля</h2><p>Введите неотрицательные числа. Комиссия должна быть меньше 100%, продажи — целым числом от 1.</p>';return}let d=Object.fromEntries(new FormData(f));calcDraft=d;let labor=+d.hours*+d.rate,creation=+d.materials+labor,base=(mode==='digital'?creation/+d.sales:creation)+ +d.pack,price=(base+ +d.profit)/(1- +d.fee/100);price=Math.ceil(price);let commission=price*+d.fee/100,profit=price-base-commission;$('#result').innerHTML=`<div class="eyebrow">РЕКОМЕНДУЕМАЯ ЦЕНА ${mode==='digital'?'ЗА ОДНУ ПРОДАЖУ':''}</div><div class="value">${money(price)}</div><p class="subtitle">Ваш труд имеет ценность ♡</p>${[['Оплата вашего времени',money(labor)],...(mode==='digital'?[['Затраты на создание',money(creation)]]:[]),['Себестоимость '+(mode==='digital'?'одной продажи':''),money(base)],['Комиссия',money(commission)],['Прибыль сверх оплаты труда',money(profit)]].map(([l,v])=>`<div class="row"><span>${l}</span><b>${v}</b></div>`).join('')}<p class="help">Цена округлена вверх до рубля.${mode==='digital'?' Затраты на создание распределены на '+esc(d.sales)+' продаж.':''}</p>`;}
function saveCalc(){if(!$('#calcform').reportValidity())return;db.templates.push({id:crypto.randomUUID(),type:'calc',name:calcDraft.name||'Расчёт '+(mode==='digital'?'цифрового продукта':'изделия'),data:{...calcDraft,mode}});persist();toast('Расчёт сохранён в шаблоны')}
function settings(){$('#app').innerHTML=heading('Всё под рукой','Ваши данные и полезные привычки.')+`<div class="grid"><section class="card"><h2>Резервная копия</h2><p class="subtitle">Записи автоматически сохраняются на этом устройстве, в этом браузере. Для переноса на другой телефон сохраните копию и загрузите её там.</p><button class="btn" onclick="backup()">Скачать копию</button><label for="restore">Восстановить из копии</label><input type="file" id="restore" accept=".json,application/json" onchange="restore(this.files[0])"><p class="help">При восстановлении текущие записи заменятся данными из копии.</p></section><section class="card"><h2>Как читать сводку</h2><p class="subtitle">«Получено» — суммы оплат из заказов по указанной дате оплаты. Отменённые заказы не учитываются.</p><p class="subtitle">«Расходы» — оплаченные записи раздела «Расходы». Запланированные расходы не списываются.</p><p class="subtitle">«Остаток» показывает движение денег. Прибыль отдельного заказа — его цена минус указанные затраты. Калькулятор помогает спланировать цену, но не создаёт расход автоматически.</p><button class="btn light" onclick="showTasks()">Открыть все задачи</button></section></div>`}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,data:db},null,2)],{type:'application/json'}));a.download='moy-biznes-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restore(file){if(!file)return;try{let v=JSON.parse(await file.text());if(v.version!==1||!v.data)throw 0;for(let k of ['orders','expenses','ideas','notes','tasks','templates']){if(!Array.isArray(v.data[k]))throw 0;for(let x of v.data[k])if(!x||typeof x.id!=='string'||(k!=='templates'&&typeof x.title!=='string'))throw 0}for(let o of v.data.orders)if(![o.price,o.paid,o.cost].every(n=>Number.isFinite(n)&&n>=0))throw 0;for(let e of v.data.expenses)if(!Number.isFinite(e.amount)||e.amount<0)throw 0;if(!confirm('Заменить все текущие записи данными из копии?'))return;db=v.data;persist();settings();toast('Данные восстановлены')}catch{alert('Не удалось прочитать копию. Выберите JSON-файл, скачанный из этого приложения.')}}
render();

</script></body></html>
